  if(!s) return "\u2014";
  const t = String(s).replace(" at ", ", ").trim();
  const m = t.match(/(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{4}),?\s*(\d{1,2}):(\d{2})\s*([AaPp])\.?[Mm]\.?/);

  const d=m[1], mon=m[2], yr=m[3], hh=String(Number(m[4])), mi=m[5], ap=m[6].toUpperCase();
  return Number(d)+" "+mon.charAt(0).toUpperCase()+mon.slice(1).toLowerCase()+" "+yr.slice(2)+", "+hh+":"+mi+" "+ap+"M";
};

/* ---------- ledger core (validated against Python: 121/121 closings) ---------- */
const LG_MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
const tallyDateISO=(s)=>{const m=/^(\d{1,2})-([A-Za-z]{3})-(\d{2})$/.exec(s||""); if(!m) return null;
  const mo=LG_MON[m[2].toLowerCase()]; if(mo===undefined) return null; return "20"+m[3]+"-"+pad2(mo+1)+"-"+pad2(Number(m[1]));};
async function parseLedgerPdf(pdf, onProgress){
  const AMT=/^[\d,]+\.\d{2}$/;
  const L={}, order=[]; let cur=null, xDr=null, xCr=null, period=null;
  const others={}; let curOther=null;   /* non-flat ledgers, e.g. Suspense */
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p); const tc=await page.getTextContent();
    const toks=[];
    tc.items.forEach(it=>{ const s=it.str||""; if(!s.trim()) return;
      const x0=it.transform[4], w=it.width||0, y=it.transform[5], n=s.length; let pos=0;
      s.split(/(\s+)/).forEach(part=>{ if(part && !/^\s+$/.test(part)){ toks.push({t:part,x0:x0+w*pos/n,x1:x0+w*(pos+part.length)/n,y}); } pos+=part.length; });
    });
    const lines=[];
    toks.forEach(tk=>{ let ln=null; for(let i=0;i<lines.length;i++){ if(Math.abs(lines[i].y-tk.y)<=2){ln=lines[i];break;} }
      if(!ln){ ln={y:tk.y,t:[]}; lines.push(ln);} ln.t.push(tk); });
    lines.sort((a,b)=>b.y-a.y); lines.forEach(l=>l.t.sort((a,b)=>a.x0-b.x0));
    let lastDate = cur ? L[cur].lastDate : null;
    for(const ln of lines){
      const words=ln.t.map(t=>t.t); const text=words.join(" "); const flat=text.replace(/\s+/g,"").toLowerCase();
      if(!period){ const pm=/(\d{1,2}-[A-Za-z]{3}-\d{2})\s+to\s+(\d{1,2}-[A-Za-z]{3}-\d{2})/.exec(text);
        if(pm) period={from:tallyDateISO(pm[1]), to:tallyDateISO(pm[2])}; }
      if(/Ledger:/.test(text) && !/Ledger:\s*[AB]\s*-\s*\d/.test(text)){
        const on=text.replace(/^.*Ledger:\s*/,"").replace(/\s*:\s*\d{1,2}-[A-Za-z]{3}-\d{2}.*$/,"").trim();
        cur=null; curOther=on; others[on]=others[on]||{name:on,closing:null}; continue; }
      const lm=/Ledger:\s*([AB])\s*-\s*(\d{1,4})\s*\(([^)\n:]*)/.exec(text);
      if(lm){ const key=lm[1]+"-"+lm[2].padStart(4,"0")+"|"+lm[3].trim();
        if(!L[key]){ L[key]={unitNo:"CCPR"+lm[1]+lm[2].padStart(4,"0"),tower:lm[1],name:lm[3].trim(),tx:[],closes:[],lastDate:null}; order.push(key); }
        curOther=null;
        if(cur!==key){ cur=key; lastDate=L[cur].lastDate; } continue; }
      const dH=ln.t.find(t=>t.t==="Debit"), cH=ln.t.find(t=>t.t==="Credit");
      if(dH&&cH){ xDr=dH.x1; xCr=cH.x1; continue; }
      if(!cur){
        if(curOther && flat.indexOf("closingbalance")>=0){
          ln.t.forEach(t=>{ if(!AMT.test(t.t)||xDr===null) return; const v=Number(t.t.replace(/,/g,""));
            /* "To Closing Balance" in Dr column => ledger holds a credit balance */
            if(Math.abs(t.x1-xDr)<=15) others[curOther].closing=-v; else if(Math.abs(t.x1-xCr)<=15) others[curOther].closing=v; });
        }
        continue; }
      if(flat.indexOf("carriedover")>=0||flat.indexOf("broughtforward")>=0) continue;
      if(ln.t.length && ln.t[0].x0<90){ const iso=tallyDateISO(ln.t[0].t); if(iso) lastDate=iso; }
      const head=words.slice(0,3); const isTo=head.indexOf("To")>=0, isBy=head.indexOf("By")>=0;
      if(!(isTo||isBy)) continue;
      let dr=0, cr=0, side=null, amt=0;
      ln.t.forEach(t=>{ if(!AMT.test(t.t)||xDr===null) return; const v=Number(t.t.replace(/,/g,""));
        if(Math.abs(t.x1-xDr)<=15){ dr+=v; side="Dr"; amt=v; } else if(Math.abs(t.x1-xCr)<=15){ cr+=v; side="Cr"; amt=v; } });
      if(flat.indexOf("closingbalance")>=0){
        if(side) L[cur].closes.push([lastDate||"", "close", side, amt]); continue; }
      if(flat.indexOf("openingbalance")>=0){
        /* arrears brought forward into this ledger period: a real amount owed (or held), not a check figure */
        if(dr||cr) L[cur].tx.push([lastDate||"", Math.round(dr*100)/100, Math.round(cr*100)/100, "Opening", ""]);
        continue; }
      if(dr===0&&cr===0) continue;
      let vch="", vno="";
      for(let i=0;i<words.length;i++){ if(["Sales","Receipt","Journal","Payment","Contra"].indexOf(words[i])>=0){ vch=words[i]; vno=words[i+1]&&!AMT.test(words[i+1])?words[i+1]:""; break; } }
      L[cur].tx.push([lastDate||"", Math.round(dr*100)/100, Math.round(cr*100)/100, vch, vno]);
    }
    if(cur) L[cur].lastDate=lastDate;
    if(onProgress) onProgress(p, pdf.numPages);
  }
  const ledgers=order.map(k=>{ const l=L[k]; delete l.lastDate; return l; });
  let latest=""; ledgers.forEach(l=>l.tx.forEach(t=>{ if(t[0]>latest) latest=t[0]; }));
  let ok=0, bad=0, nomark=0; const badList=[];
  ledgers.forEach(l=>{ const cl=l.closes.filter(c=>c[1]==="close"); if(!cl.length){nomark++;return;}
    const c=cl[cl.length-1]; const exp=c[2]==="Cr"?c[3]:-c[3];
    const b=l.tx.filter(t=>t[0]&&t[0]<=c[0]).reduce((s,t)=>s+t[1]-t[2],0);
    if(Math.abs(b-exp)<0.02) ok++; else { bad++; badList.push(l.tower+"-"+l.unitNo.slice(5)); } });
  return {ledgers, latest, period, others:Object.keys(others).map(k=>others[k]), check:{ok,bad,nomark,badList}};
}
function computeAgeing(tx, asof){
  const mm=s=>Number(s.slice(0,4))*12+Number(s.slice(5,7))-1;
  const dnum=s=>Date.UTC(Number(s.slice(0,4)),Number(s.slice(5,7))-1,Number(s.slice(8,10)))/86400000;
  const A=mm(asof);
  const rows=tx.filter(t=>t[0]&&t[0]<=asof).slice().sort((a,b)=>a[0].localeCompare(b[0]));
  const bal=Math.round(rows.reduce((s,t)=>s+t[1]-t[2],0)*100)/100;
  let credit=rows.reduce((s,t)=>s+t[2],0);
  const deb=rows.filter(t=>t[1]>0).map(t=>[t[0],t[1],t[3]==="Opening"]);
  deb.forEach(d=>{ const u=Math.min(d[1],credit); d[1]-=u; credit-=u; });
  const B={cur:0,b12:0,b35:0,b611:0,b12p:0}; let oldest=null, oldestOpening=false;
  deb.forEach(d=>{ if(d[1]<=0.005) return; const m=A-mm(d[0]);
    if(m<=0) B.cur+=d[1]; else if(m<=2) B.b12+=d[1]; else if(m<=5) B.b35+=d[1]; else if(m<=11) B.b611+=d[1]; else B.b12p+=d[1];
    if(d[1]>10 && !oldest){ oldest=d[0]; oldestOpening=d[2]; } });
  const live = bal>=10 && oldest;
  const r2=v=>Math.round(v*100)/100;
  return {bal, lots: deb.filter(d=>d[1]>0.005).map(d=>[d[0],r2(d[1])]),
          oldest: live?oldest.slice(0,7):"", oldestDate: live?oldest:"", oldestOpening: live?oldestOpening:false,
          months: live?(A-mm(oldest)+1):0, days: live?Math.round(dnum(asof)-dnum(oldest)):0,
          cur:r2(B.cur), b12:r2(B.b12), b35:r2(B.b35), b611:r2(B.b611), b12p:r2(B.b12p), b6:r2(B.b611+B.b12p)};
}

/* ---------- promise + flag derivation (shared by app, status page and PDFs) ---------- */
function promiseStatus(p, bal, today){
  const red = Number(p.balAtCall||0) - bal;
  const amt = Number(p.promiseAmt||0);
  if(bal < 10)                 return {s:"Cleared",       tone:"ok",   done:true};
  if(amt>0 && red >= amt-1)    return {s:"Kept",          tone:"ok",   done:true};
  if(red > 1)                  return (p.promiseDate && today > p.promiseDate)
                                  ? {s:"Partly kept", tone:"warn", done:true}
                                  : {s:"Part received", tone:"info"};
  if(p.promiseDate && today > p.promiseDate) return {s:"Broken", tone:"bad", broken:true};
  return {s:"Due "+fmtD(p.promiseDate), tone:"info", open:true};
}

function deriveCalls(duesRows, calls, ageMap, today){
  const wk = weekStartISO(today), wkEnd = addDaysISO(wk,6);
  const by = {};
  calls.slice().sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(c => { (by[c.unitNo]=by[c.unitNo]||[]).push(c); });
  const out = [];
  duesRows.forEach(r => {
    const hist = by[r.unitNo] || [];
    const bal = Number(r.outstanding||0);
    if(bal < 10 && !hist.length) return;
    const last = hist.length ? hist[hist.length-1] : null;
    const weekCalls = hist.filter(c => c.date>=wk && c.date<=wkEnd);
    let prom = null;
    for(let i=hist.length-1;i>=0;i--){ if(hist[i].code==="PTP"||hist[i].code==="PART"){ prom=hist[i]; break; } }
    const ps = prom ? promiseStatus(prom, bal, today) : null;
    let streak = 0;
    for(let i=hist.length-1;i>=0;i--){ if(hist[i].code==="NA"||hist[i].code==="SO") streak++; else break; }
    const flags = [];
    if(bal>=10){
      if(ps && ps.broken)                 flags.push("Broken promise");
      if(streak>=3)                       flags.push("Visit / letter");
      if(last && last.code==="DISP")      flags.push("Dispute");
      if(last && last.code==="LEDG")      flags.push("Ledger required");
      if(last && last.code==="REF")       flags.push("Refused");
      if(last && last.code==="SOLD")      flags.push("Contact owner");
      if(last && last.code==="PAID")      flags.push("Paid claim — verify");
    }
    out.push({...r, bal, hist, last, weekCalls, calledThisWeek: weekCalls.length>0,
              prom, ps, streak, flags, age: ageMap ? ageMap[r.unitNo] : null, active: bal>=10});
  });
  return out;
}

function callStats(rows, calls, from, to, today){
  const inR = calls.filter(c => c.date>=from && c.date<=to);
  const flatsCalled = {}; inR.forEach(c => { flatsCalled[c.unitNo]=true; });
  const byCaller = {}, byCode = {};
  inR.forEach(c => {
    const k=c.caller||"—"; byCaller[k]=byCaller[k]||{calls:0,flats:{}}; byCaller[k].calls++; byCaller[k].flats[c.unitNo]=true;
    byCode[c.code]=(byCode[c.code]||0)+1;
  });
  const active = rows.filter(r=>r.active);
  const pending = active.filter(r=>!flatsCalled[r.unitNo]);
  const promisesMade = inR.filter(c=>c.code==="PTP"||c.code==="PART");
  const promisedAmt = promisesMade.reduce((s,c)=>s+Number(c.promiseAmt||0),0);
  const promRows = rows.filter(r=>r.prom && r.prom.date>=from && r.prom.date<=to);
  const kept = promRows.filter(r=>r.ps && (r.ps.s==="Kept"||r.ps.s==="Cleared"));
  const partly = promRows.filter(r=>r.ps && (r.ps.s==="Partly kept"||r.ps.s==="Part received"));
  const broken = rows.filter(r=>r.ps && r.ps.broken && r.active);
  const dueInRange = rows.filter(r=>r.ps && r.ps.open && r.prom.promiseDate>=from && r.prom.promiseDate<=to);
  const received = promRows.reduce((s,r)=>s+Math.max(0, Number(r.prom.balAtCall||0)-r.bal),0);
  return {calls:inR, nCalls:inR.length, nFlats:Object.keys(flatsCalled).length, byCaller, byCode,
          active, pending, promisesMade, promisedAmt, kept, partly, broken, dueInRange, received,
          activeAmt: active.reduce((s,r)=>s+r.bal,0)};
}

/* ══════════ LEDGER AGEING REPORT (per tower) ══════════ */
const AGE_THRESHOLDS = [[30,"1 month"],[60,"2 months"],[90,"3 months"],[180,"6 months"],[365,"12 months"]];
function buildAgeingRows(ledger, records, tower, minDays, minAmt){
  if(!ledger || !ledger.flats || !ledger.meta) return [];
  const asof = ledger.meta.asofOverride || ledger.meta.asof;
  const dnum=s=>Date.UTC(Number(s.slice(0,4)),Number(s.slice(5,7))-1,Number(s.slice(8,10)))/86400000;
  const recMap={}; records.forEach(r=>{ recMap[r.unitNo]=r; });
  const out=[];
  Object.keys(ledger.flats).forEach(u=>{
    if(u.slice(4,5)!==tower) return;
    const f=ledger.flats[u]; const a=computeAgeing(f.tx, asof);
    if(a.bal<10 || a.days<=minDays) return;
    const overdue=a.lots.filter(l=>dnum(asof)-dnum(l[0])>minDays).reduce((s,l)=>s+l[1],0);
    if(overdue<minAmt) return;
    const rec=recMap[u]||{};
    const dirWins=(rec.status==="Confirmed"||rec.status==="Updated") && rec.ownerName;
    const rc=f.tx.filter(t=>t[0]&&t[0]<=asof&&t[2]>0&&t[3]==="Receipt").sort((x,y)=>x[0].localeCompare(y[0]));
    out.push({unitNo:u, flat:tower+"-"+u.slice(5), name:niceName(dirWins?rec.ownerName:f.names.join(" / ")),
      mobile:firstMobile(rec.ownerMobile), overdue, ...a,
      last: rc.length ? fmtD(rc[rc.length-1][0]) : "—"});
  });
  return out;
}

function noticeCalc(tx, asof, deadline){
  const dnum=s=>Date.UTC(Number(s.slice(0,4)),Number(s.slice(5,7))-1,Number(s.slice(8,10)))/86400000;
  const rows=tx.filter(t=>t[0]&&t[0]<=asof).slice().sort((a,b)=>a[0].localeCompare(b[0]));
  let credit=rows.reduce((s,t)=>s+t[2],0);
  const bills=rows.filter(t=>t[1]>0).map(t=>({date:t[0], amt:t[1], unpaid:t[1], typ:t[3], vno:t[4]}));
  bills.forEach(b=>{ const u=Math.min(b.unpaid,credit); b.unpaid-=u; credit-=u; });
  const open=bills.filter(b=>b.unpaid>0.5).map(b=>{
    const due=addDaysISO(b.date,NOTICE_GRACE); const days=Math.max(0,Math.round(dnum(deadline)-dnum(due)));
    const label = b.typ==="Opening" ? "Arrears b/f (opening)" : b.typ==="Journal" ? "Arrears / Jnl "+(b.vno||"") : (b.vno||b.typ||"Debit");
    return {...b, due, days, label, int:b.unpaid*NOTICE_RATE*days/365}; });
  const bal=open.reduce((s,b)=>s+b.unpaid,0), interest=open.reduce((s,b)=>s+b.int,0);
  return {open, bal, interest, total:bal+interest};
}

      if(d.section==="head"&&d.column.index>=3) d.cell.styles.halign=[3,4,7].includes(d.column.index)?"right":"center"; }});
  y=doc.lastAutoTable.finalY+5;
  para("Bills dated after "+fmtDot(addDaysISO(deadline,-NOTICE_GRACE))+" are not yet due and carry no interest. For any query please contact the Property Manager, "+pm+".",y,{size:8,color:GREY,lh:3.6});
}
/* rows from buildAgeingRows; mode "one" = combined PDF, "zip" = one PDF per flat in a ZIP, "single" = rows[0] only */
async function downloadNotices(ledger, rows, noticeDate, pm, mode){
  if(!window.jspdf || !window.jspdf.jsPDF) return false;
  const asof=ledger.meta.asofOverride||ledger.meta.asof, ds=fmtDot(noticeDate);
  const mk=()=>new window.jspdf.jsPDF({unit:"mm",format:"a4"});
  const one=(doc,r)=>drawNotice(doc,{flat:r.flat,name:r.name},noticeCalc(ledger.flats[r.unitNo].tx,asof,addDaysISO(noticeDate,NOTICE_PAY_DAYS)),noticeDate,asof,pm);
  if(mode==="one"){ const doc=mk(); rows.forEach((r,i)=>{ if(i) doc.addPage(); one(doc,r); });
    doc.save("CCPT_Dues_Notices_"+rows.length+"_flats_"+ds+".pdf"); return true; }
  if(mode==="single"||rows.length===1){ const doc=mk(); one(doc,rows[0]); doc.save("CCPT_Notice_"+rows[0].flat+"_"+ds+".pdf"); return true; }
  if(!window.JSZip) return false;
  const zip=new window.JSZip();
  rows.forEach(r=>{ const doc=mk(); one(doc,r); zip.file("CCPT_Notice_"+r.flat+"_"+ds+".pdf", doc.output("arraybuffer")); });
  const blob=await zip.generateAsync({type:"blob"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="CCPT_Dues_Notices_"+ds+".zip";
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
  return true;
}

/* ══════════ CALLS MODULE (used by #calls and admin Calls tab) ══════════ */
function CallsModule({mode, duesRows, calls, callers, ledger, ageMap, notify, onExit, osAsOn}){
  const today = todayISO();
  const wk = weekStartISO(today), wkEnd = addDaysISO(wk,6);
  const [caller, setCaller]   = useState(lsGet("ccpt_caller") || "");
  const [tab, setTab]         = useState("pending");
  const [q, setQ]             = useState("");
  const [tower, setTower]     = useState("all");
  const [sortBy, setSortBy]   = useState("amt");
  const [logRow, setLogRow]   = useState(null);
  const [histRow, setHistRow] = useState(null);
  const [form, setForm]       = useState({code:"",promiseDate:"",promiseAmt:"",note:""});
  const [saving, setSaving]   = useState(false);
  const [newCaller, setNewCaller] = useState("");

  const rows = React.useMemo(() => deriveCalls(duesRows, calls, ageMap, today), [duesRows, calls, ageMap, today]);
  const active = rows.filter(r=>r.active);
  const calledWk = active.filter(r=>r.calledThisWeek);
  const pct = active.length ? Math.round(calledWk.length/active.length*100) : 0;

  const callerNames = callers.length ? callers : DEFAULT_CALLERS;
  const pickCaller = n => { setCaller(n); lsSet("ccpt_caller", n); };

  const tabRows = (() => {
    let list;
    if(tab==="pending")  list = active.filter(r=>!r.calledThisWeek);
    else if(tab==="called")   list = active.filter(r=>r.calledThisWeek);
    else if(tab==="promises") list = rows.filter(r=>r.ps && !r.ps.done);
    else if(tab==="flags")    list = active.filter(r=>r.flags.length);
    else if(tab==="cleared")  list = rows.filter(r=>!r.active && r.hist.length);
    else list = rows.slice();
    if(tower!=="all") list = list.filter(r=>r.tower===tower);
    const qq = q.trim().toLowerCase();
    if(qq) list = list.filter(r => (r.flat+" "+r.unitNo+" "+(r.name||"")).toLowerCase().indexOf(qq)>=0);
    const broken = r => r.flags.indexOf("Broken promise")>=0 ? 1 : 0;
    list.sort((a,b) => {
      if(tab==="called") return (b.last?b.last.ts:0)-(a.last?a.last.ts:0);
      if(tab==="promises") return String(a.prom?a.prom.promiseDate:"").localeCompare(String(b.prom?b.prom.promiseDate:""));
      if(broken(b)-broken(a)) return broken(b)-broken(a);
      if(sortBy==="age") return ((b.age&&b.age.months)||0)-((a.age&&a.age.months)||0) || b.bal-a.bal;
      if(sortBy==="flat") return a.unitNo.localeCompare(b.unitNo);
      return b.bal-a.bal;
    });
    return list;
  })();

  const openLog = r => {
    setLogRow(r);
    setForm({code:"", promiseDate:addDaysISO(today,3), promiseAmt:String(Math.round(r.bal)), note:""});
  };
  const saveCall = () => {
    if(!caller){ notify("Select your name first","error"); return; }
    if(!form.code){ notify("Pick an outcome","error"); return; }
    const isProm = CODE_MAP[form.code].promise;
    if(isProm && !form.promiseDate){ notify("Enter promise date","error"); return; }
    if(isProm && !(Number(form.promiseAmt)>0)){ notify("Enter promised amount","error"); return; }
    const now = new Date();
    const id = "c"+now.getTime().toString(36)+Math.random().toString(36).slice(2,6);
    const rec = {id, unitNo:logRow.unitNo, flat:logRow.flat, name:logRow.name||"",
      date:isoLocal(now), time:pad2(now.getHours())+":"+pad2(now.getMinutes()), ts:now.getTime(),
      caller, code:form.code, note:(form.note||"").trim(),
      promiseDate: isProm ? form.promiseDate : "", promiseAmt: isProm ? Number(form.promiseAmt) : 0,
      balAtCall: Math.round(logRow.bal*100)/100, osAsOn: osAsOn||""};
    setSaving(true);
    DB.ref(CALLS_PATH+"/calls/"+id).set(rec)
      .then(()=>{ setSaving(false); notify("✅ "+logRow.flat+" — "+CODE_MAP[form.code].l); setLogRow(null); })
      .catch(e=>{ console.error(e); setSaving(false); notify("Save failed — check connection","error"); });
  };
  const deleteCall = c => {
    if(!window.confirm("Delete this call entry?")) return;
    DB.ref(CALLS_PATH+"/calls/"+c.id).remove().then(()=>notify("Entry deleted")).catch(()=>notify("Delete failed","error"));
  };
  const canDelete = c => mode==="admin" || (c.caller===caller && c.date===today);
  const addCaller = () => {
    const n = newCaller.trim(); if(!n) return;
    if(callerNames.map(x=>x.toLowerCase()).indexOf(n.toLowerCase())>=0){ pickCaller(n); setNewCaller(""); return; }
    DB.ref(CALLS_PATH+"/callers").set(callerNames.concat([n])).then(()=>{ pickCaller(n); setNewCaller(""); notify("Caller added"); });
  };
  const statement = r => {
    const f = ledger && ledger.flats ? ledger.flats[r.unitNo] : null;
    if(!f || !f.tx.length){ notify("No ledger uploaded for this flat","error"); return; }

            <button key={n} onClick={()=>pickCaller(n)} className="w-full py-3 rounded-xl border border-amber-200 bg-amber-50 text-amber-900 font-bold hover:bg-amber-100">{n}</button>
          ))}
        </div>
        <div className="flex gap-2">
          <input value={newCaller} onChange={e=>setNewCaller(e.target.value)} placeholder="+ Add caller name" className={INP}/>
          <button onClick={addCaller} className="btn-gold px-4 rounded-lg text-sm">Add</button>
        </div>
      </div>
    </div>
  );

  const TABS = [["pending","Pending",active.filter(r=>!r.calledThisWeek).length],["called","Called",calledWk.length],
                ["promises","Promises",rows.filter(r=>r.ps&&!r.ps.done).length],["flags","Flags",active.filter(r=>r.flags.length).length],
                ["cleared","Cleared",rows.filter(r=>!r.active&&r.hist.length).length],["all","All",rows.length]];
  const isProm = form.code && CODE_MAP[form.code].promise;

      {/* week header */}

        <div className="flex justify-between items-start gap-2 mb-2">
          <div>
            <div className="text-xs font-bold text-gray-400 uppercase tracking-wider">Week {fmtD(wk)} – {fmtD(wkEnd)}</div>
            <div className="text-sm text-gray-600 mt-0.5">Caller: <b className="text-amber-900">{caller}</b>
              <button onClick={()=>{ setCaller(""); lsDel("ccpt_caller"); }} className="ml-2 text-xs text-amber-600 underline">change</button></div>
          </div>
          <div className="text-right">
            <div className="text-2xl font-black text-amber-900 leading-none">{calledWk.length}<span className="text-sm text-gray-400 font-bold"> / {active.length}</span></div>
            <div className="text-[11px] text-gray-400 font-semibold">called this week</div>
          </div>
        </div>
        <div className="h-2 bg-gray-100 rounded-full overflow-hidden">
          <div className="h-full bg-gradient-to-r from-amber-500 to-emerald-500 rounded-full" style={{width:pct+"%"}}/>
        </div>
        <div className="flex justify-between text-[11px] text-gray-400 mt-1.5">
          <span>Dues as per OS of {osAsOn?fmtD(osAsOn):"—"}</span>
          <span>{ledger && ledger.meta ? "Ageing per ledger to "+fmtD(ledger.meta.asof) : "No ledger — ageing off"}</span>
        </div>
      </div>

      {/* tabs */}
      <div className="flex gap-1.5 overflow-x-auto pb-1 mb-2" style={{WebkitOverflowScrolling:"touch"}}>
        {TABS.map(([k,l,n])=>(
          <button key={k} onClick={()=>setTab(k)}

            {l} <span className={tab===k?"text-amber-200":"text-amber-500"}>{n}</span></button>
        ))}
      </div>
      <div className="flex gap-2 mb-3">
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search flat / name" className="flex-1 min-w-0 px-3 py-2 border border-amber-200 rounded-lg text-sm bg-white"/>
        <select value={tower} onChange={e=>setTower(e.target.value)} className="px-2 py-2 border border-amber-200 rounded-lg text-sm bg-white">

          </div> ); })()}

                    {ageMap && <td className="px-3 py-2 whitespace-nowrap"><AgeLine age={r.active?r.age:null}/></td>}
                    <td className="px-3 py-2 text-xs text-gray-500 whitespace-nowrap">{r.last?fmtD(r.last.date)+" · "+r.last.caller:<b className="text-amber-700">Not called</b>}</td>
                    <td className="px-3 py-2 whitespace-nowrap">{r.last?<Chip tone={CODE_MAP[r.last.code].tone}>{CODE_MAP[r.last.code].l}</Chip>:"—"}</td>
                    <td className="px-3 py-2 whitespace-nowrap">{r.ps?<Chip tone={r.ps.tone}>{r.ps.s}</Chip>:"—"}</td>
                  </tr>))}

      </div>
    </div>
  );
}

    const ref = DB.ref(LEDGER_PATH);

  /* dues listener */
  useEffect(() => {
    const ref = DB.ref(DUES_PATH);
    ref.on("value", snap => {
      const raw = snap.val() || {};
      setSnapshots(toArr(raw.snapshots).sort((a,b)=>(b.date||"").localeCompare(a.date||"")));
      setCollections(toArr(raw.collections));
    }, e => console.error(e));
    return () => ref.off();
  }, []);

  useEffect(() => {
    const ref = DB.ref(DB_PATH);
    ref.on("value", snap => {
      try {
        const raw = snap.val();
        if(!raw) {
          const seeded = SEED_DATA.map(d => ({...emptyFlat(),...d,id:uid(),status:"Pending",locked:false,unlockRequested:false}));
          ref.set(seeded).catch(console.error);

    }, e => { console.error(e); setLoaded(true); setSyncSt("error"); });
    return () => ref.off();
  }, []);

  const notify  = (msg,type="success") => { setToast({msg,type}); setTimeout(()=>setToast(null),2700); };
  const saveAll = (list) => {
    setSyncSt("saving");
    DB.ref(DB_PATH).set(list).then(()=>setSyncSt("synced")).catch(e=>{console.error(e);setSyncSt("error");});
  };

  const flatsByTower = t => records.filter(r=>r.tower===t).sort((a,b)=>a.unitNo.localeCompare(b.unitNo));

  const loadFlat = () => {
    if(!selTower||!selUnit) return;
    const rec = records.find(r=>r.unitNo===selUnit);
    if(rec) setForm({...rec});
    else notify("Flat not found","error");
  };

  /* ── RESIDENT SUBMIT ── */
  const submitForm = () => {
    if(!form) return;
    setSaving(true);
    const orig = records.find(r=>r.id===form.id);
    const changed = JSON.stringify({...orig,lastUpdated:"",status:""}) !== JSON.stringify({...form,lastUpdated:"",status:""});
    const updated = {
      ...form,
      status: changed ? "Updated" : "Confirmed",
      locked: true,                  // lock after first submission
      unlockRequested: false,
      lastUpdated: tsNow()
    };
    const next = records.map(r=>r.id===form.id?updated:r);
    DB.ref(DB_PATH).set(next).then(()=>{
      notify(changed?"✅ Details updated & locked!":"✅ Details confirmed & locked!");
      setForm(null); setSelUnit(""); setSelTower(""); setSaving(false);
    }).catch(e=>{console.error(e);notify("Save failed","error");setSaving(false);});
  };

  /* ── RESIDENT: Request Unlock ── */
  const requestUnlock = () => {
    if(!form) return;
    const updated = {...form, unlockRequested:true, unlockRequestedAt:tsNow()};
    const next = records.map(r=>r.id===form.id?updated:r);
    DB.ref(DB_PATH).set(next).then(()=>{
      notify("🔓 Unlock request sent to admin!","info");
      setForm(null); setSelUnit(""); setSelTower("");
    }).catch(e=>{console.error(e);notify("Request failed","error");});
  };

  /* ── ADMIN: Unlock a flat ── */
  const adminUnlock = (id) => {
    const next = records.map(r=>r.id===id?{...r,locked:false,unlockRequested:false,unlockRequestedAt:""}:r);
    saveAll(next); notify("🔓 Flat unlocked — resident can now edit");
  };

  /* ── ADMIN: Reset to Pending ── */
  const resetStatus = (id) => {
    const next = records.map(r=>r.id===id?{...r,status:"Pending",locked:false,unlockRequested:false,unlockRequestedAt:"",lastUpdated:""}:r);
    saveAll(next); notify("Status reset to Pending");
  };

  /* admin stats */
  const unlockCount = records.filter(r=>r.unlockRequested).length;
  const stats = {
    total:     records.length,
    pending:   records.filter(r=>r.status==="Pending").length,
    confirmed: records.filter(r=>r.status==="Confirmed").length,
    updated:   records.filter(r=>r.status==="Updated").length,
    unlock:    unlockCount,
  };

  const adminRecs = records.filter(r => {
    const tOk = adminFilter.tower==="all"||r.tower===adminFilter.tower;
    const sOk = adminFilter.status==="all"||
                (adminFilter.status==="unlock"?r.unlockRequested:r.status===adminFilter.status);
    const qOk = !adminFilter.q||r.ownerName?.toLowerCase().includes(adminFilter.q.toLowerCase())||r.unitNo?.toLowerCase().includes(adminFilter.q.toLowerCase());
    return tOk&&sOk&&qOk;
  });

  /* add flat */
  const addFlat = () => {
    if(!addFlatForm.unitNo.trim()||!addFlatForm.ownerName.trim()){notify("Unit No and Owner Name required","error");return;}
    if(records.find(r=>r.unitNo===addFlatForm.unitNo.trim())){notify("Unit No already exists","error");return;}
    saveAll([...records,{...addFlatForm,unitNo:addFlatForm.unitNo.trim(),id:uid(),status:"Pending",locked:false,unlockRequested:false}]);
    notify("Flat added!"); setModal(null); setAddFlatForm(emptyFlat());
  };

  /* excel */
  const exportExcel = () => {
    const rows = records.map((r,i)=>({
      "SL":i+1,"Unit No":r.unitNo,"Tower":r.tower,
      "Owner Name":r.ownerName||"","Owner Mobile":r.ownerMobile||"",
      "Owner WhatsApp":r.ownerWhatsapp||"","Owner Email":r.ownerEmail||"",
      "Is Rented":r.isRented?"Yes":"No",
      "Tenant Name":r.tenantName||"","Tenant Mobile":r.tenantMobile||"","Tenant Email":r.tenantEmail||"",
      "Status":r.status||"Pending","Locked":r.locked?"Yes":"No",
      "Unlock Requested":r.unlockRequested?"Yes":"No","Last Updated":r.lastUpdated||"—",
    }));
    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.json_to_sheet(rows);
    ws["!cols"]=[4,14,8,28,14,14,30,10,24,14,28,12,8,16,20].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb,ws,"Resident Directory");
    XLSX.writeFile(wb,`RCCP_Directory_${new Date().toISOString().slice(0,10)}.xlsx`);
    notify("Excel downloaded!");
  };

  /* ══════════ DUES ENGINE ══════════ */

  /* latest snapshot PER TOWER — snapshots are stored per tower, so a single
     "most recent" snapshot would silently drop the other tower's figures. */
  const latestByTower = React.useMemo(() => {
    const m = {};
    snapshots.forEach(s => {
      if(!s || !s.tower) return;
      if(!m[s.tower] || (s.date||"") > (m[s.tower].date||"")) m[s.tower] = s;
    });
    return m;
  }, [snapshots]);
  const activeSnaps = Object.keys(latestByTower).sort().map(k=>latestByTower[k]);
  const latestSnap  = activeSnaps.length ? activeSnaps[0] : null;
  /* all distinct snapshot dates, newest first — a "position" is a date */
  const snapDates = [...new Set(snapshots.map(s=>s.date).filter(Boolean))].sort().reverse();
  const asOnDate  = activeSnaps.length
    ? activeSnaps.map(s=>s.date).sort().slice(-1)[0] : null;
  /* combined position across both towers as at a given date */
  const positionAt = (date) => {
    const m = {};
    ["A","B"].forEach(tw => {
      const cands = snapshots.filter(s=>s.tower===tw && (!date || (s.date||"") <= date))
                             .sort((a,b)=>(a.date||"").localeCompare(b.date||""));
      const s = cands[cands.length-1];
      if(s) toArr(s.rows).forEach(r => { m[r.unitNo] = Number(r.debit||0)-Number(r.credit||0); });
    });
    return m;
  };

  /* collections not yet absorbed by a newer snapshot */
  const liveCollections = collections.filter(c => !c.reconciled);

  const collectedFor = (unitNo) =>
    liveCollections.filter(c => c.unitNo===unitNo).reduce((s,c)=>s+Number(c.amount||0),0);

  /* merged view: every directory flat + its dues position */
  const duesRows = React.useMemo(() => {
    /* AGGREGATE per flat — a Tally file can legitimately carry more than one
       ledger row for the same flat; overwriting would silently lose money. */
    const snapMap = {};
    activeSnaps.forEach(sn => toArr(sn.rows).forEach(r => {
      const cur = snapMap[r.unitNo];
      if(cur){
        cur.debit  += Number(r.debit||0);
        cur.credit += Number(r.credit||0);
        if(r.name && cur.names.indexOf(r.name)<0) cur.names.push(r.name);
        cur.ledgers += 1;
      } else {
        snapMap[r.unitNo] = {debit:Number(r.debit||0), credit:Number(r.credit||0),
                             name:r.name||"", names:r.name?[r.name]:[], tower:r.tower, ledgers:1};
      }
    }));
    /* every directory flat, PLUS any Tally flat missing from the directory */
    const seen = {};
    records.forEach(r => { seen[r.unitNo]=true; });
    const extra = Object.keys(snapMap).filter(u => !seen[u]).map(u => ({
      unitNo:u, tower:snapMap[u].tower || u.slice(4,5),
      ownerName:"", ownerMobile:"", status:"Pending", notInDirectory:true,
    }));
    return records.concat(extra).map(rec => {
      const s = snapMap[rec.unitNo];
      const debit  = s ? Number(s.debit||0)  : 0;
      const credit = s ? Number(s.credit||0) : 0;
      const opening = debit - credit;
      const collected = collectedFor(rec.unitNo);
      const outstanding = opening - collected;
      /* name precedence: confirmed/updated directory wins, else Tally */
      const dirWins = (rec.status==="Confirmed" || rec.status==="Updated") && !rec.notInDirectory;
      const tallyName = s ? (s.names.length>1 ? s.names.join(" / ") : s.name) : "";
      const name = dirWins ? (rec.ownerName||"") : (tallyName || rec.ownerName || "");
      return {
        unitNo: rec.unitNo, tower: rec.tower,
        flat: rec.tower + "-" + rec.unitNo.slice(5),
        name, nameSource: dirWins ? "Directory" : (s ? "Tally" : "Directory"),
        mobile: rec.ownerMobile||"", status: rec.status||"Pending",
        notInDirectory: !!rec.notInDirectory,
        ledgers: s ? s.ledgers : 0,
        inTally: !!s, debit, credit, opening, collected, outstanding,
        /* type reflects the CURRENT position, after quick collections */
        type: outstanding > 0.005 ? "Debit"
            : outstanding < -0.005 ? "Credit"
            : (opening === 0 && collected === 0) ? "Nil" : "Settled",
      };
    });
  }, [records, snapshots, collections]);

  /* ageing per flat from the optional ledger upload */
  const ageMap = React.useMemo(() => {
    if(!ledger || !ledger.flats || !ledger.meta) return null;
    const m = {};
    Object.keys(ledger.flats).forEach(u => { m[u] = computeAgeing(ledger.flats[u].tx, ledger.meta.asof); });
    return m;
  }, [ledger]);

  const duesTotals = duesRows.reduce((a,r)=>({
    debit:  a.debit  + (r.opening>0 ? r.opening : 0),          /* as billed in Tally */
    credit: a.credit + (r.outstanding<0 ? -r.outstanding : 0), /* current advances, incl. overpayment */
    collected: a.collected + r.collected,
    outstanding: a.outstanding + (r.outstanding>0 ? r.outstanding : 0),
  }), {debit:0,credit:0,collected:0,outstanding:0});

  const SORTS = {
    out_desc:  {l:"Outstanding \u2014 High to Low", f:(a,b)=> b.outstanding-a.outstanding},
    out_asc:   {l:"Outstanding \u2014 Low to High", f:(a,b)=> a.outstanding-b.outstanding},
    flat_asc:  {l:"Flat No. \u2014 A to Z",         f:(a,b)=> a.unitNo.localeCompare(b.unitNo)},
    flat_desc: {l:"Flat No. \u2014 Z to A",         f:(a,b)=> b.unitNo.localeCompare(a.unitNo)},
    name_asc:  {l:"Owner Name \u2014 A to Z",       f:(a,b)=> (a.name||"").localeCompare(b.name||"")},
    coll_desc: {l:"Collected \u2014 High to Low",   f:(a,b)=> b.collected-a.collected},
  };
  const sortFn = (SORTS[duesSort] || SORTS.out_desc).f;

  const filteredDues = duesRows.filter(r => {
    if(duesFilter.tower!=="all" && r.tower!==duesFilter.tower) return false;
    if(duesFilter.type==="Debit"  && !(r.outstanding>0)) return false;
    if(duesFilter.type==="Credit"  && !(r.outstanding<-0.005)) return false;
    if(duesFilter.type==="Settled" && r.type!=="Settled")      return false;
    if(duesFilter.type==="Nil"     && r.type!=="Nil")          return false;
    if(duesFilter.min && r.outstanding < Number(duesFilter.min)) return false;
    const q=(duesFilter.q||"").toLowerCase();
    if(q && !(r.name.toLowerCase().includes(q) || r.flat.toLowerCase().includes(q) || r.unitNo.toLowerCase().includes(q))) return false;
    return true;
  }).sort(sortFn);

  /* ── PDF PARSER (pdf.js, column-aware) ── */
  const parseDuesPdf = async (file) => {
    setParsing(true); setParsed(null);
    try {
      if(!window.pdfjsLib){ notify("PDF engine not loaded","error"); setParsing(false); return; }
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const buf = await file.arrayBuffer();
      const pdf = await window.pdfjsLib.getDocument({data:buf}).promise;

      let xDebit=null, xCredit=null, tower=null, asOf=null;
      const rows=[], warnings=[]; let stated=null;

      for(let p=1; p<=pdf.numPages; p++){
        const page = await pdf.getPage(p);
        const tc = await page.getTextContent();
        /* group items into visual lines by y */
        const lines = {};
        tc.items.forEach(it => {
          const t=(it.str||"").trim(); if(!t) return;
          const x=it.transform[4], y=Math.round(it.transform[5]);
          let key=null;
          for(const k of Object.keys(lines)) if(Math.abs(Number(k)-y)<=2){ key=k; break; }
          if(key===null) key=String(y);
          (lines[key]=lines[key]||[]).push({t,x,w:it.width||0});
        });
        const ordered = Object.keys(lines)
          .sort((a,b)=>Number(b)-Number(a))
          .map(k => lines[k].sort((a,b)=>a.x-b.x));

        ordered.forEach(items => {
          const text = items.map(i=>i.t).join(" ");
          if(tower===null){
            const tm = text.match(/Tower\s*:\s*([AB])/i);
            if(tm) tower = tm[1].toUpperCase();
          }
          if(asOf===null){
            const am = text.match(/to\s+(\d{1,2}-[A-Za-z]{3}-\d{2})/);
            if(am) asOf = tallyDateISO(am[1]);
          }
          /* header row -> capture column centres */
          const dIt = items.find(i=>/^Debit$/i.test(i.t));
          const cIt = items.find(i=>/^Credit$/i.test(i.t));
          if(dIt && cIt){ xDebit = dIt.x + dIt.w/2; xCredit = cIt.x + cIt.w/2; }

          const flat_ = text.replace(/\s+/g,"");
          if(/grandtotal/i.test(flat_)){
            const nums=items.filter(i=>/^[\d,]+\.\d{2}$/.test(i.t)).map(i=>Number(i.t.replace(/,/g,"")));
            if(nums.length>=1) stated={debit:nums[0]||0, credit:nums[1]||0};
            return;
          }
          if(/carriedover|broughtforward/i.test(flat_)) return;

          /* data row: A-0002 (Name) amount */
          const m = text.match(/^([AB])\s*-\s*(\d{1,4})\s*\(([^)]*)\)?/);
          if(!m) return;
          const unitNo = toUnitNo(m[1]+"-"+m[2]);
          if(!unitNo) return;
          if(m[2].length!==4) warnings.push(m[1]+"-"+m[2]+" normalised to "+unitNo.slice(4,5)+"-"+unitNo.slice(5));
          const amts = items.filter(i=>/^[\d,]+\.\d{2}$/.test(i.t));
          if(!amts.length) return;
          const a = amts[amts.length-1];
          const val = Number(a.t.replace(/,/g,""));
          const centre = a.x + a.w/2;
          let isCredit;
          if(xDebit!=null && xCredit!=null){
            isCredit = Math.abs(centre-xCredit) < Math.abs(centre-xDebit);
          } else {
            isCredit = false; warnings.push("Column header not found on page "+p);
          }
          rows.push({unitNo, tower:unitNo.slice(4,5), name:(m[3]||"").trim(),
                     debit: isCredit?0:val, credit: isCredit?val:0});
        });
      }

      if(!rows.length){ notify("No dues rows found in this PDF","error"); setParsing(false); return; }

      const sumD = rows.reduce((s,r)=>s+r.debit,0);
      const sumC = rows.reduce((s,r)=>s+r.credit,0);
      const ok = stated ? (Math.abs(sumD-stated.debit)<1 && Math.abs(sumC-stated.credit)<1) : null;
      if(stated && !ok) warnings.push("Parsed totals differ from the PDF's Grand Total \u2014 check the Debit/Credit split.");

      const known = new Set(records.map(r=>r.unitNo));
      const unknown = rows.filter(r=>!known.has(r.unitNo)).map(r=>r.tower+"-"+r.unitNo.slice(5));
      if(unknown.length) warnings.push("Not in directory (will still be counted): "+unknown.join(", "));

      /* duplicate flat numbers — more than one ledger row for the same flat */
      const cnt = {}; rows.forEach(r => { cnt[r.unitNo]=(cnt[r.unitNo]||0)+1; });
      const dups = Object.keys(cnt).filter(u=>cnt[u]>1).map(u=>{
        const rs = rows.filter(r=>r.unitNo===u);
        return {flat: u.slice(4,5)+"-"+u.slice(5),
                entries: rs.map(r=>({name:r.name, amt:(r.debit||0)-(r.credit||0)})),
                total: rs.reduce((s,r)=>s+(r.debit||0)-(r.credit||0),0)};
      });

      setParsed({tower: tower||rows[0].tower, rows, sumD, sumC, stated, ok, dups, asOf: asOf || todayISO(), asOfFound: !!asOf,
                 warnings:[...new Set(warnings)], fileName:file.name});
      setParsing(false);
    } catch(e){
      console.error(e); notify("Could not read this PDF","error"); setParsing(false);
    }
  };

  /* commit parsed snapshot */
  const commitSnapshot = () => {
    if(!parsed) return;
    const today = parsed.asOf || todayISO();   /* snapshot dated as per the report, not the upload day */
    const existing = snapshots.find(s => s.date===today && s.tower===parsed.tower);
    const snap = {
      id: existing ? existing.id : uid(),
      date: today, tower: parsed.tower,
      label: "Tower "+parsed.tower+" \u2014 "+today,
      rows: parsed.rows,
      totals: {debit:parsed.sumD, credit:parsed.sumC},
      uploadedAt: tsNow(), fileName: parsed.fileName,
    };
    const others = snapshots.filter(s => s.id!==snap.id);
    /* mark prior live collections for this tower as reconciled */
    const upd = collections.map(cn => {
      if(cn.reconciled) return cn;
      const rowHere = parsed.rows.find(r=>r.unitNo===cn.unitNo);
      /* only receipts dated on/before the report date can be inside Tally's figure */
      return (rowHere && (cn.date||"") <= today) ? {...cn, reconciled:true, reconciledOn:today, reconciledSnap:snap.id} : cn;
    });
    setSyncSt("saving");
    DB.ref(DUES_PATH).update({snapshots:[snap,...others], collections:upd})
      .then(()=>{ setSyncSt("synced"); notify("\u2705 Snapshot saved for Tower "+parsed.tower); setParsed(null); setModal(null); })
      .catch(e=>{console.error(e); setSyncSt("error"); notify("Save failed","error");});
  };

  /* quick collection */
  const openCollect = (row, full) => {
    setCollectRow(row); setEditCollId(null);
    setCollectForm({
      amount: full ? String(Math.max(0,row.outstanding).toFixed(2)) : "",
      mode: "UPI",
      date: new Date().toISOString().slice(0,10),
      remark: "",
    });
    setModal("collect");
  };

  const saveCollection = () => {
    const amt = Number(collectForm.amount);
    if(!collectRow || !amt || amt<=0){ notify("Enter a valid amount","error"); return; }
    let next, msg;
    if(editCollId){
      next = collections.map(cn => cn.id===editCollId
        ? {...cn, amount:amt, mode:collectForm.mode, date:collectForm.date,
           remark:collectForm.remark||"", editedAt: tsNow()}
        : cn);
      msg = "\u2705 Entry updated \u2014 "+money(amt)+" for "+collectRow.flat;
    } else {
      next = [...collections, {
        id: uid(), unitNo: collectRow.unitNo, flat: collectRow.flat,
        name: collectRow.name, amount: amt, mode: collectForm.mode,
        date: collectForm.date, remark: collectForm.remark||"",
        reconciled: false, recordedAt: tsNow(),
        snapshotId: latestSnap ? latestSnap.id : null,
      }];
      msg = "\u2705 "+money(amt)+" recorded for "+collectRow.flat;
    }
    setSyncSt("saving");
    DB.ref(DUES_PATH+"/collections").set(next)
      .then(()=>{ setSyncSt("synced"); notify(msg);
                  setModal(null); setCollectRow(null); setEditCollId(null); })
      .catch(e=>{console.error(e); setSyncSt("error"); notify("Save failed","error");});
  };

  /* open an existing entry for editing */
  const openEditCollection = (cn) => {
    const row = duesRows.find(r=>r.unitNo===cn.unitNo) ||
                {unitNo:cn.unitNo, flat:cn.flat, name:cn.name, mobile:"", outstanding:0};
    /* show the position excluding this entry, so the figure makes sense while editing */
    setCollectRow({...row, outstanding: row.outstanding + (cn.reconciled?0:Number(cn.amount||0))});
    setEditCollId(cn.id);
    setCollectForm({amount:String(cn.amount||""), mode:cn.mode||"UPI",
                    date:cn.date||new Date().toISOString().slice(0,10), remark:cn.remark||""});
    setModal("collect");
  };

  /* log rows: period + scope filtered */
  const logRows = React.useMemo(() => {
    const all = collections.slice().sort((a,b)=>
      (b.date||"").localeCompare(a.date||"") || (b.recordedAt||"").localeCompare(a.recordedAt||""));
    return all.filter(cn=>{
      if(logScope==="pending"    && cn.reconciled)  return false;
      if(logScope==="reconciled" && !cn.reconciled) return false;
      const d=cn.date||"";
      if(logFrom && d<logFrom) return false;
      if(logTo   && d>logTo)   return false;
      return true;
    });
  }, [collections, logScope, logFrom, logTo]);
  const logTotal = logRows.reduce((s,c)=>s+Number(c.amount||0),0);

  const deleteCollection = (id) => {
    setSyncSt("saving");
    DB.ref(DUES_PATH+"/collections").set(collections.filter(c=>c.id!==id))
      .then(()=>{ setSyncSt("synced"); notify("Entry reversed"); })
      .catch(e=>{console.error(e); setSyncSt("error");});
  };

  /* ── collection register for a period (quick entries) ── */
  const collectionPeriod = React.useMemo(() => {
    const all = collections.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    if(!all.length) return null;
    const first = all[0].date || "";
    const last  = all[all.length-1].date || "";
    const from  = collFrom || first;
    const to    = collTo   || last;
    const rows = all.filter(cn => {
      const d = cn.date || "";
      if(d < from || d > to) return false;
      if(collScope==="unreconciled" && cn.reconciled) return false;
      if(collScope==="reconciled"  && !cn.reconciled) return false;
      return true;
    }).map(cn => {
      const rec = records.find(r=>r.unitNo===cn.unitNo);
      return {...cn, mobile: rec ? (rec.ownerMobile||"") : "",
              tower: rec ? rec.tower : (cn.unitNo||"").slice(4,5)};
    });
    const total = rows.reduce((s,r)=>s+Number(r.amount||0),0);
    const byMode = {}, byDay = {}, byTower = {};
    rows.forEach(r=>{
      const a=Number(r.amount||0);
      byMode[r.mode||"Other"] = (byMode[r.mode||"Other"]||0)+a;
      byDay[r.date||"—"]      = (byDay[r.date||"—"]||0)+a;
      byTower[r.tower||"—"]   = (byTower[r.tower||"—"]||0)+a;
    });
    return {from, to, first, last, rows, total, byMode, byDay, byTower,
            flats: new Set(rows.map(r=>r.unitNo)).size};
  }, [collections, records, collFrom, collTo, collScope]);

  /* movement between two dates (combined across both towers) */
  const movement = React.useMemo(() => {
    if(!snapDates.length) return null;
    const fromDate = moveFrom || snapDates[snapDates.length-1];
    const fMap = positionAt(fromDate);
    let tMap = {}, provisional = false, toLabel = "";
    if(moveTo === "live" || !moveTo){
      provisional = true;
      toLabel = "Live \u2014 quick entries";
      const base = positionAt(snapDates[0]);
      Object.keys(base).forEach(u => { tMap[u] = base[u] - collectedFor(u); });
      Object.keys(fMap).forEach(u => { if(!(u in tMap)) tMap[u] = fMap[u] - collectedFor(u); });
    } else {
      toLabel = "Tally as on " + moveTo;
      tMap = positionAt(moveTo);
    }
    const units=[...new Set([...Object.keys(fMap),...Object.keys(tMap)])];
    const rows=units.map(u=>{
      const rec=records.find(r=>r.unitNo===u);
      const dr=duesRows.find(r=>r.unitNo===u);
      const open=fMap[u]||0, close=(u in tMap)?tMap[u]:open;
      return {unitNo:u, flat:(rec?rec.tower:u.slice(4,5))+"-"+u.slice(5),
              name: dr?dr.name:(rec?rec.ownerName:""), mobile: rec?rec.ownerMobile||"":"",
              opening:open, closing:close, collected:open-close};
    }).filter(r=>Math.abs(r.collected)>0.005).sort((a,b)=>b.collected-a.collected);
    const tot=rows.reduce((a,r)=>({opening:a.opening+r.opening,closing:a.closing+r.closing,collected:a.collected+r.collected}),{opening:0,closing:0,collected:0});
    return {fromLabel:"Tally as on "+fromDate, toLabel, provisional, rows, tot};
  }, [snapshots, collections, moveFrom, moveTo, records, duesRows]);

    doc.autoTable({

    ["A","B"].forEach(tw=>{

      doc.text("Tower "+tw+" \u2014 "+sub.length+" flats",M,y); y+=1.5;
      const withMob = duesPdfMobile;

          return base.concat([moneyS(Math.abs(r.opening)), r.collected?moneyS(r.collected):"\u2014",
                              moneyS(Math.abs(r.outstanding)), r.type]);
        }),
        foot:[(withMob?["","","Total"]:["","Total"]).concat([
               moneyS(sub.reduce((s,r)=>s+Math.abs(r.opening),0)),

             6:{cellWidth:18,halign:"center"}}
          : {0:{cellWidth:20,halign:"center",fontStyle:"bold"},1:{cellWidth:60},
             2:{cellWidth:30,halign:"right"},3:{cellWidth:28,halign:"right"},

      doc.text("Page "+i+" of "+pages,W-M,H-7,{align:"right"});

    doc.save("CCPT_Dues_"+ty+(duesPdfMobile?"":"_ShareSafe")+"_"+new Date().toISOString().slice(0,10)+".pdf");
    setModal(null); notify("\u2705 Dues PDF downloaded");

    doc.text("Period: "+cp.from+"  to  "+cp.to+"   |   "+cp.rows.length+" receipts   |   "+scopeL,W/2,y,{align:"center"}); y+=5;

    doc.autoTable({
      startY:y,
      head:[["Receipts","Flats","Total Collected"]],
      body:[[String(cp.rows.length),String(cp.flats),moneyS(cp.total)]],

    doc.text("Receipt Register \u2014 "+cp.rows.length+" entries",M,y); y+=1.5;
    doc.autoTable({

      head:[["Date","Flat","Owner Name","Mobile","Amount","Mode","Remark","Status"]],
      body: cp.rows.map(r=>[r.date||"\u2014", r.flat||"\u2014", r.name||"\u2014", r.mobile||"\u2014",
                            moneyS(r.amount), r.mode||"\u2014", r.remark||"\u2014",
                            r.reconciled?"Reconciled":"Pending"]),
      foot:[["","","","Total",moneyS(cp.total),"","",""]],
      theme:"grid",
      styles:{fontSize:7.2,cellPadding:1.5,valign:"middle",lineColor:[154,165,173],lineWidth:0.2,overflow:"linebreak"},

  /* ── optional full-ledger upload → ageing + statements ── */
  const parseLedgerFile = async (file) => {
    setLedgerParsed(null); setLedgerBusy({p:0,n:0});
    try {
      if(!window.pdfjsLib){ notify("PDF engine not loaded","error"); setLedgerBusy(null); return; }
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const pdf = await window.pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
      const r = await parseLedgerPdf(pdf, (p,n)=>{ if(p%10===0||p===n) setLedgerBusy({p,n}); });
      if(!r.ledgers.length){ notify("No flat ledgers found in this PDF","error"); setLedgerBusy(null); return; }
      const flats = {};
      r.ledgers.forEach(l => { const f = flats[l.unitNo] = flats[l.unitNo] || {names:[], tx:[]};
        if(f.names.indexOf(l.name)<0) f.names.push(l.name); f.tx = f.tx.concat(l.tx); });
      /* keep true bill dates: if this ledger starts with an Opening Balance that equals the stored
         ledger's balance the day before, replace the lump with the stored earlier transactions */
      const pStart = r.period && r.period.from ? r.period.from : null;
      let spliced=0, lumped=0;
      if(pStart){
        Object.keys(flats).forEach(u => {
          const f=flats[u]; const op=f.tx.filter(t=>t[3]==="Opening");
          if(!op.length) return;
          const opBal=op.reduce((s,t)=>s+t[1]-t[2],0);
          const prev = ledger && ledger.flats ? ledger.flats[u] : null;
          const prevTx = prev ? prev.tx.filter(t=>t[0] && t[0]<pStart && t[3]!=="Opening") : [];
          const prevBal = prevTx.reduce((s,t)=>s+t[1]-t[2],0);
          if(prevTx.length && Math.abs(prevBal-opBal)<0.02){ f.tx = prevTx.concat(f.tx.filter(t=>t[3]!=="Opening")); spliced++; }
          else if(Math.abs(opBal)>0.005) lumped++;
        });
      }
      const sus = (r.others||[]).filter(o=>o.closing!==null && Math.abs(o.closing)>0.005);
      setLedgerParsed({flats, ledgers:r.ledgers.length, latest:r.latest, asof:(r.period&&r.period.to)||r.latest,
                       period:r.period, others:sus, spliced, lumped, check:r.check, fileName:file.name});
    } catch(e){ console.error(e); notify("Could not read this ledger PDF","error"); }
    setLedgerBusy(null);
  };

              )}
              {Number(collectForm.amount)>0 && (
                <div className="bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 flex justify-between items-center text-xs">
                  <span className="text-gray-500 font-semibold">Position after this entry</span>
                  {(() => {
                    const base = collectRow.outstanding - Number(collectForm.amount||0);
                    return <span className={`font-black ${base>0.005?"text-red-700":base<-0.005?"text-emerald-700":"text-gray-500"}`}>
                      {Math.abs(base)<=0.005 ? "Settled" : (base>0 ? money(base)+" due" : money(-base)+" advance")}
                    </span>;
                  })()}
                </div>
              )}
              <div className="grid grid-cols-2 gap-3">
                <Fld label="Mode">
                  <select value={collectForm.mode} onChange={e=>setCollectForm(f=>({...f,mode:e.target.value}))} className={INP}>
                    {["UPI","Cash","Bank Transfer","Cheque","Card","Other"].map(m=><option key={m}>{m}</option>)}
                  </select>
                </Fld>
                <Fld label="Date">
                  <input type="date" value={collectForm.date} onChange={e=>setCollectForm(f=>({...f,date:e.target.value}))} className={INP}/>
                </Fld>
              </div>
              <Fld label="Remark (optional)">
                <input value={collectForm.remark} onChange={e=>setCollectForm(f=>({...f,remark:e.target.value}))}
                  className={INP} placeholder="Receipt no., cheque no., notes…"/>
              </Fld>
              <div className="bg-blue-50 border border-blue-100 rounded-xl p-3 text-xs text-blue-800">
                {editCollId
                  ? "Editing changes the recorded amount and re-derives the flat's position. Reconciled entries stay reconciled."
                  : "This is the committee's own record, not a Tally receipt. It will be marked reconciled when the next Tally PDF is uploaded."}
              </div>
              <div className="flex gap-3 pt-2 border-t border-amber-100">
                <button onClick={()=>{setModal(null);setCollectRow(null);setEditCollId(null);}} className="flex-1 py-2.5 bg-amber-50 text-amber-800 border border-amber-200 rounded-xl text-sm font-semibold">Cancel</button>
                <button onClick={saveCollection} className="btn-gold flex-1 py-2.5 rounded-xl text-sm">{editCollId?"Update Entry":"Record"}</button>
              </div>
            </div>
          )}
        </Modal>

        {/* Dues PDF Modal */}
        <Modal open={modal==="duesPdf"} onClose={()=>setModal(null)} title="💰 Outstanding Dues Report">
          <div className="space-y-4">
            <div>
              <p className={LBL}>Select Entry Type</p>
              <div className="space-y-1.5">
                {[
                  {k:"All",    l:"All Entries",         n:duesRows.length},
                  {k:"Debit",  l:"Debit — Outstanding", n:duesRows.filter(r=>r.outstanding>0.005).length},
                  {k:"Credit", l:"Credit — Advance",    n:duesRows.filter(r=>r.outstanding<-0.005).length},
                  {k:"Settled",l:"Settled",             n:duesRows.filter(r=>r.type==="Settled").length},
                  {k:"Nil",    l:"Nil Dues",            n:duesRows.filter(r=>r.type==="Nil").length},
                ].map(o=>(
                  <label key={o.k} className={`flex items-center gap-3 cursor-pointer p-2.5 rounded-lg border transition-colors ${duesPdfType===o.k?"border-amber-400 bg-amber-50":"border-amber-100 hover:bg-amber-50"}`}>
                    <input type="radio" name="dpf" checked={duesPdfType===o.k} onChange={()=>setDuesPdfType(o.k)} className="w-4 h-4 accent-amber-700"/>
                    <span className="text-sm font-semibold text-amber-900 flex-1">{o.l}</span>
                    <span className="text-xs font-bold text-amber-600">{o.n} flats</span>
                  </label>
                ))}
              </div>
            </div>
            <Fld label="Sort Order">
              <select value={duesSort} onChange={e=>setDuesSort(e.target.value)} className={INP}>
                {Object.keys(SORTS).map(k=><option key={k} value={k}>{SORTS[k].l}</option>)}
              </select>
              <p className="text-xs text-gray-400 mt-1">Rows stay grouped by tower; this sorts within each tower.</p>
            </Fld>
            <div>
              <p className={LBL}>Contact Details</p>
              <label className={`flex items-center gap-3 cursor-pointer p-3 rounded-xl border transition-colors ${duesPdfMobile?"border-red-200 bg-red-50":"border-emerald-200 bg-emerald-50"}`}>
                <input type="checkbox" checked={duesPdfMobile}
                  onChange={e=>setDuesPdfMobile(e.target.checked)} className="w-4 h-4 accent-amber-700"/>
                <span className="text-sm font-semibold text-amber-900 flex-1">Include mobile numbers</span>
                <span className={`text-xs font-bold ${duesPdfMobile?"text-red-700":"text-emerald-700"}`}>
                  {duesPdfMobile?"Committee only":"Share-safe"}
                </span>
              </label>
            </div>
            {duesPdfMobile ? (
              <div className="bg-red-50 border border-red-200 rounded-xl p-3 text-xs text-red-800">
                <b>Confidential.</b> Includes owner mobile numbers. Share only within the committee — not in the resident group.
              </div>
            ) : (
              <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-xs text-emerald-800">
                <b>Safe to share.</b> Mobile numbers excluded. Flat number, owner name and amounts remain visible, so residents can still find their own position.
              </div>
            )}
            <div className="flex gap-3 pt-2 border-t border-amber-100">
              <button onClick={()=>setModal(null)} className="flex-1 py-2.5 bg-amber-50 text-amber-800 border border-amber-200 rounded-xl text-sm font-semibold">Cancel</button>
              <button onClick={downloadDuesPdf} className="btn-gold flex-1 py-2.5 rounded-xl text-sm">📥 Download</button>
            </div>
          </div>
        </Modal>

        {/* Collection Summary Modal */}
        <Modal open={modal==="collSummary"} onClose={()=>setModal(null)} title="🧾 Collection Summary">
          <div className="space-y-4">
            <div className="grid grid-cols-2 gap-3">
              <Fld label="From Date">
                <input type="date" value={collFrom || (collectionPeriod?collectionPeriod.first:"")}
                  onChange={e=>setCollFrom(e.target.value)} className={INP}/>
              </Fld>
              <Fld label="To Date">
                <input type="date" value={collTo || (collectionPeriod?collectionPeriod.last:"")}
                  onChange={e=>setCollTo(e.target.value)} className={INP}/>
              </Fld>
            </div>

            <div className="flex gap-2 flex-wrap">
              {[["This month",()=>{const d=new Date();setCollFrom(new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10));setCollTo(new Date().toISOString().slice(0,10));}],
                ["Last 7 days",()=>{const d=new Date();d.setDate(d.getDate()-6);setCollFrom(d.toISOString().slice(0,10));setCollTo(new Date().toISOString().slice(0,10));}],
                ["All time",()=>{setCollFrom("");setCollTo("");}]].map(([l,fn])=>(
                <button key={l} onClick={fn}
                  className="text-xs bg-amber-50 text-amber-800 border border-amber-200 px-3 py-1.5 rounded-lg font-semibold hover:bg-amber-100">{l}</button>
              ))}
            </div>

            <Fld label="Include">
              <select value={collScope} onChange={e=>setCollScope(e.target.value)} className={INP}>
                <option value="all">All entries</option>
                <option value="unreconciled">Pending reconciliation only</option>
                <option value="reconciled">Reconciled only</option>
              </select>
            </Fld>

            {collectionPeriod && (
              <div className="bg-amber-50 border border-amber-200 rounded-xl p-4">
                <div className="grid grid-cols-3 gap-3 text-center mb-3">
                  <div><div className="text-xs text-gray-400 font-bold uppercase">Receipts</div>
                    <div className="font-black text-sm text-amber-900">{collectionPeriod.rows.length}</div></div>
                  <div><div className="text-xs text-gray-400 font-bold uppercase">Flats</div>
                    <div className="font-black text-sm text-amber-900">{collectionPeriod.flats}</div></div>
                  <div><div className="text-xs text-gray-400 font-bold uppercase">Collected</div>
                    <div className="font-black text-sm text-emerald-700">{money(collectionPeriod.total)}</div></div>
                </div>
                {collectionPeriod.rows.length>0 && (
                  <div className="border-t border-amber-200 pt-2 space-y-1">
                    {Object.keys(collectionPeriod.byMode).sort((a,b)=>collectionPeriod.byMode[b]-collectionPeriod.byMode[a]).map(m=>(
                      <div key={m} className="flex justify-between text-xs">
                        <span className="text-gray-600 font-semibold">{m}</span>
                        <span className="font-bold text-amber-900">{money(collectionPeriod.byMode[m])}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {collectionPeriod && collectionPeriod.rows.length===0 && (
              <p className="text-sm text-gray-400 text-center py-2">No receipts in this period.</p>
            )}

            <div className="flex gap-3 pt-2 border-t border-amber-100">
              <button onClick={()=>setModal(null)} className="flex-1 py-2.5 bg-amber-50 text-amber-800 border border-amber-200 rounded-xl text-sm font-semibold">Cancel</button>
              <button onClick={downloadCollectionPdf} disabled={!collectionPeriod||!collectionPeriod.rows.length}
                className="btn-gold flex-1 py-2.5 rounded-xl text-sm disabled:opacity-40">📥 Download</button>
            </div>
          </div>
        </Modal>

        {/* Movement Modal */}
        <Modal open={modal==="movement"} onClose={()=>setModal(null)} title="📈 Collection Movement">
          <div className="space-y-4">
            <Fld label="From (opening position)">
              <select value={moveFrom} onChange={e=>setMoveFrom(e.target.value)} className={INP}>
                <option value="">— earliest upload ({snapDates[snapDates.length-1]||"—"}) —</option>
                {snapDates.map(d=><option key={d} value={d}>Tally as on {d}</option>)}
              </select>
            </Fld>
            <Fld label="To (closing position)">
              <select value={moveTo} onChange={e=>setMoveTo(e.target.value)} className={INP}>
                <option value="live">Live — quick entries (provisional)</option>
                {snapDates.map(d=><option key={d} value={d}>Tally as on {d}</option>)}
              </select>
              <p className="text-xs text-gray-400 mt-1">Each date combines Tower A and Tower B.</p>
            </Fld>
            {movement && (
              <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 grid grid-cols-3 gap-3 text-center">
                <div><div className="text-xs text-gray-400 font-bold uppercase">Opening</div><div className="font-black text-sm text-amber-900">{money(movement.tot.opening)}</div></div>
                <div><div className="text-xs text-gray-400 font-bold uppercase">Collected</div><div className="font-black text-sm text-emerald-700">{money(movement.tot.collected)}</div></div>
                <div><div className="text-xs text-gray-400 font-bold uppercase">Closing</div><div className="font-black text-sm text-red-700">{money(movement.tot.closing)}</div></div>
              </div>
            )}
            {movement && movement.provisional && (
              <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800">
                <b>Provisional.</b> Based on quick collection entries, not yet reconciled against Tally. Upload the next dues PDF for a confirmed figure.
              </div>
            )}
            {movement && movement.rows.length===0 && (
              <p className="text-sm text-gray-400 text-center py-3">No movement between these two points.</p>
            )}
            <div className="flex gap-3 pt-2 border-t border-amber-100">
              <button onClick={()=>setModal(null)} className="flex-1 py-2.5 bg-amber-50 text-amber-800 border border-amber-200 rounded-xl text-sm font-semibold">Cancel</button>
              <button onClick={downloadMovementPdf} disabled={!movement||!movement.rows.length}
                className="btn-gold flex-1 py-2.5 rounded-xl text-sm disabled:opacity-40">📥 Download</button>
            </div>
          </div>
        </Modal>

        {/* Add Flat Modal */}
        <Modal open={modal==="addFlat"} onClose={()=>setModal(null)} title="➕ Add New Flat" wide>
          <div className="space-y-4">
            <div className="grid grid-cols-2 gap-4">
              <Fld label="Unit No *"><input value={addFlatForm.unitNo} onChange={e=>setAddFlatForm(f=>({...f,unitNo:e.target.value}))} className={INP} placeholder="e.g. CCPRA0106" autoFocus/></Fld>
              <Fld label="Tower *">
                <select value={addFlatForm.tower} onChange={e=>setAddFlatForm(f=>({...f,tower:e.target.value}))} className={INP}>
                  <option value="A">Tower A</option><option value="B">Tower B</option>
                </select>
              </Fld>
            </div>
            <Fld label="Owner Name *"><input value={addFlatForm.ownerName} onChange={e=>setAddFlatForm(f=>({...f,ownerName:e.target.value}))} className={INP} placeholder="Full name"/></Fld>
            <div className="grid grid-cols-2 gap-4">
              <Fld label="Owner Mobile"><input value={addFlatForm.ownerMobile} onChange={e=>setAddFlatForm(f=>({...f,ownerMobile:e.target.value}))} className={INP} placeholder="Mobile"/></Fld>
              <Fld label="Owner Email"><input value={addFlatForm.ownerEmail} onChange={e=>setAddFlatForm(f=>({...f,ownerEmail:e.target.value}))} className={INP} placeholder="Email"/></Fld>
            </div>
            <div className="flex gap-3 pt-2 border-t border-amber-100">
              <button onClick={()=>setModal(null)} className="flex-1 py-2.5 bg-amber-50 text-amber-800 border border-amber-200 rounded-xl text-sm font-semibold">Cancel</button>
              <button onClick={addFlat} className="btn-gold flex-1 py-2.5 rounded-xl text-sm">Add Flat</button>
            </div>
          </div>
        </Modal>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
